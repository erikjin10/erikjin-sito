<!doctype html>
<html lang="it">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordina — Bottega Pelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,400..700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #e3dccc; --surface: #d7cab0; --surface-2: #cabb9d;
    --ink: #221c15; --muted: #6f6553; --brass: #92722f; --brass-strong: #7a5f28;
    --line: rgba(34,28,21,0.16); --line-strong: rgba(34,28,21,0.32);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:640px; margin:0 auto; padding: clamp(24px,5vw,56px) 20px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:0.9rem; }
  a.back:hover{ color:var(--brass-strong); }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(1.7rem,4vw,2.3rem); margin: 18px 0 6px; }
  .summary{
    background:var(--surface); border:1px solid var(--line); padding:16px 18px;
    margin-bottom: 28px; font-family:'IBM Plex Mono', monospace; font-size:0.85rem;
  }
  .summary b{ color:var(--brass-strong); }
  label{ display:block; font-size:0.85rem; color:var(--muted); margin: 18px 0 6px; }
  input, textarea, select{
    width:100%; padding:11px 12px; border:1px solid var(--line-strong); background:#fff;
    font-family:'Work Sans', sans-serif; font-size:0.95rem; border-radius:2px;
  }
  textarea{ min-height:80px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }
  button{
    margin-top:26px; width:100%; padding:14px; background:var(--ink); color:var(--bg);
    border:none; font-size:1rem; font-weight:500; cursor:pointer; border-radius:2px;
  }
  button:hover{ background:var(--brass-strong); }
  .hp{ position:absolute; left:-9999px; }
  .policy-note{
    font-size:0.82rem; line-height:1.6; color:var(--muted);
    background:var(--surface); border:1px solid var(--line); padding:12px 14px; margin-top:22px;
  }
  .policy-note a{ color:var(--brass-strong); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Torna al sito</a>
  <h1>Completa il tuo ordine</h1>
  <div class="summary" id="riepilogo">Caricamento modello scelto…</div>

  <form name="ordine" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="grazie.html">
    <input type="hidden" name="form-name" value="ordine" />
    <input type="hidden" name="modello" id="f-modello" />
    <input type="hidden" name="colore" id="f-colore" />
    <p class="hp"><label>Non compilare questo campo: <input name="bot-field" /></label></p>

    <label for="nome">Nome e cognome</label>
    <input id="nome" name="nome" required>

    <div class="row2">
      <div>
        <label for="telefono">Telefono</label>
        <input id="telefono" name="telefono" type="tel" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
    </div>

    <label for="paese">Paese di spedizione</label>
    <select id="paese" name="paese" required>
      <optgroup label="Italia">
        <option value="Italia">Italia</option>
      </optgroup>
      <optgroup label="Europa (+10€ spedizione)">
        <option value="Francia">Francia</option>
        <option value="Germania">Germania</option>
        <option value="Spagna">Spagna</option>
        <option value="Portogallo">Portogallo</option>
        <option value="Belgio">Belgio</option>
        <option value="Paesi Bassi">Paesi Bassi</option>
        <option value="Austria">Austria</option>
        <option value="Svizzera">Svizzera</option>
        <option value="Altro paese europeo">Altro paese europeo</option>
      </optgroup>
      <optgroup label="Regno Unito (+30€ spedizione)">
        <option value="Regno Unito">Regno Unito</option>
      </optgroup>
      <optgroup label="Fuori Europa (+40€ spedizione)">
        <option value="Stati Uniti">Stati Uniti</option>
        <option value="Canada">Canada</option>
        <option value="Altro paese extra-UE">Altro paese extra-UE</option>
      </optgroup>
    </select>

    <label for="indirizzo">Indirizzo di spedizione (via e numero civico)</label>
    <input id="indirizzo" name="indirizzo" required>

    <div class="row2">
      <div>
        <label for="citta">Città</label>
        <input id="citta" name="citta" required>
      </div>
      <div>
        <label for="cap">CAP</label>
        <input id="cap" name="cap" required>
      </div>
    </div>

    <label for="provincia">Provincia</label>
    <input id="provincia" name="provincia" required>

    <label for="note">Note (facoltativo)</label>
    <textarea id="note" name="note"></textarea>

    <button type="submit">Conferma ordine e procedi al pagamento →</button>

    <p class="policy-note">Diritto di recesso entro 14 giorni dalla ricezione. Le spese di spedizione per la restituzione del prodotto sono a carico del cliente. <a href="resi.html">Leggi la policy di reso →</a></p>
  </form>
</div>

<script>
  const PRICES = { 'Emily Large': 80, 'Emily Mini': 50, 'Emily Mini Suede': 55, 'Emy': 115, 'Ely Suede': 85, 'Ely Martellato': 85 };
  const SHIPPING_EXTRA = {
    'Italia': 0,
    'Francia': 10, 'Germania': 10, 'Spagna': 10, 'Portogallo': 10, 'Belgio': 10,
    'Paesi Bassi': 10, 'Austria': 10, 'Svizzera': 10, 'Altro paese europeo': 10,
    'Regno Unito': 30,
    'Stati Uniti': 40, 'Canada': 40, 'Altro paese extra-UE': 40
  };
  const params = new URLSearchParams(window.location.search);
  const modello = params.get('modello') || 'Emily Large';
  const colore = params.get('colore') || '';
  const prezzoBase = PRICES[modello] || 70;
  document.getElementById('f-modello').value = modello;
  document.getElementById('f-colore').value = colore;

  const paeseSelect = document.getElementById('paese');
  const riepilogo = document.getElementById('riepilogo');

  function aggiornaRiepilogo(){
    const paese = paeseSelect.value || 'Italia';
    const extra = SHIPPING_EXTRA[paese] || 0;
    const totale = prezzoBase + extra;
    let html = 'Modello: <b>' + modello + (colore ? ' — ' + colore : '') + '</b><br>';
    if (extra > 0) {
      html += 'Prezzo prodotto: <b>€' + prezzoBase + '</b><br>Spedizione (' + paese + '): <b>€' + extra + '</b><br>Totale: <b>€' + totale + '</b>';
    } else {
      html += 'Prezzo: <b>€' + prezzoBase + ' — spedizione inclusa</b>';
    }
    riepilogo.innerHTML = html;
  }
  aggiornaRiepilogo();
  paeseSelect.addEventListener('change', aggiornaRiepilogo);

  document.querySelector('form[name="ordine"]').addEventListener('submit', function(){
    const paese = paeseSelect.value || 'Italia';
    this.action = 'grazie.html?modello=' + encodeURIComponent(modello) + '&colore=' + encodeURIComponent(colore) + '&paese=' + encodeURIComponent(paese);
  });
</script>
</body>
</html>
