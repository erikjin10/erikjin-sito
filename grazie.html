<script>
  const PRICES = { 'Emily Large': 72, 'Emily Mini': 50, 'Emily Mini Suede': 55, 'Emy': 103.5, 'Ely Suede': 76.5, 'Ely Martellato': 76.5 };
  const SHIPPING_EXTRA = {
    'Italia': 0,
    'Francia': 10, 'Germania': 10, 'Spagna': 10, 'Portogallo': 10, 'Belgio': 10,
    'Paesi Bassi': 10, 'Austria': 10, 'Svizzera': 10, 'Altro paese europeo': 10,
    'Regno Unito': 30,
    'Stati Uniti': 40, 'Canada': 40, 'Altro paese extra-UE': 40
  };
  const params = new URLSearchParams(window.location.search);
  const modello = params.get('modello') || 'Emily Large';
  const colore = params.get('colore') || '';
  const paese = params.get('paese') || 'Italia';
  const prezzoBase = PRICES[modello] || 70;
  const extra = SHIPPING_EXTRA[paese] || 0;
  const totale = prezzoBase + extra;

  function ejRenderSummary(){
    const lang = window.EJ_CURRENT_LANG || 'it';
    const t = (k) => window.EJ_t ? window.EJ_t(k, lang) : k;
    const fmt = (n) => window.EJ_fmtEuro ? window.EJ_fmtEuro(n) : n;
    const paeseLabel = window.EJ_translateCountry ? window.EJ_translateCountry(paese, lang) : paese;
    let riepilogoHtml = t('sum_modello_ordinato') + '<b>' + modello + (colore ? ' — ' + colore : '') + '</b><br>' + t('sum_paese') + '<b>' + paeseLabel + '</b><br>';
    if (extra > 0) {
      riepilogoHtml += t('sum_prezzo_prodotto') + '<b>€' + fmt(prezzoBase) + '</b><br>' + t('sum_spedizione') + ': <b>€' + fmt(extra) + '</b><br>' + t('sum_totale_pagare') + '<b>€' + fmt(totale) + '</b>';
    } else {
      riepilogoHtml += t('sum_totale_pagare') + '<b>€' + fmt(totale) + ' (' + t('sped_inclusa_paren') + ')</b>';
    }
    document.getElementById('riepilogo').innerHTML = riepilogoHtml;
    document.getElementById('pay-link').textContent = t('gz_pay_btn') + ' — €' + fmt(totale);
  }
  ejRenderSummary();
  window.addEventListener('ej-lang-changed', ejRenderSummary);

  const business = 'fashionstefanosrl@gmail.com';
  const itemName = encodeURIComponent(modello + (colore ? ' - ' + colore : '') + (paese !== 'Italia' ? ' - spedizione ' + paese : ''));
  const payUrl = 'https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=' + encodeURIComponent(business) +
    '&item_name=' + itemName + '&amount=' + totale + '&currency_code=EUR&no_shipping=1';
  document.getElementById('pay-link').href = payUrl;
</script>

.", "pl": "wiele charakterów.", "lt": "daugybė charakterių.", "ro": "multe personalități.", "sq": "shumë karaktere.", "bg": "много характери."}, "collezione_p": {"en": "The same bauletto shape, worked in different hues. Same cut, same hand — choose the colour that suits you.", "fr": "La même forme bauletto, déclinée en différentes teintes. Même coupe, même main — choisissez la couleur qui vous ressemble.", "de": "Dieselbe Bauletto-Form, verarbeitet in unterschiedlichen Farbtönen. Gleicher Schnitt, gleiche Handarbeit — wählen Sie die Farbe, die zu Ihnen passt.", "es": "La misma forma bauletto, trabajada en distintos tonos. Mismo corte, misma mano — elige el color que más se te parezca.", "ru": "Одна и та же форма bauletto в разных оттенках. Тот же крой, та же рука мастера — выберите цвет, который вам ближе.", "ar": "نفس الشكل bauletto، بألوان مختلفة. نفس القَصّة، نفس اليد الصانعة — اختر اللون الذي يشبهك.", "pt": "A mesma forma bauletto, trabalhada em tons diferentes. Mesmo corte, mesma mão — escolha a cor que combina consigo.", "zh": "同一款bauletto造型，演绎多种色彩。同样的裁剪，同样的手艺——选择最适合你的颜色。", "ja": "同じバウレットの形を、さまざまな色で。同じ裁断、同じ手仕事——あなたに似合う色をお選びください。", "ko": "같은 바울레토 형태를 다양한 색상으로. 같은 재단, 같은 손길 — 당신에게 어울리는 색을 선택하세요.", "uk": "Та сама форма bauletto, у різних відтінках. Той самий крій, та сама рука — оберіть колір, який пасує саме вам.", "hr": "Isti oblik bauletto, izrađen u različitim nijansama. Isti kroj, ista ruka — odaberite boju koja vam odgovara.", "pl": "Ten sam kształt bauletto, w różnych odcieniach. Ten sam krój, ta sama ręka — wybierz kolor, który do Ciebie pasuje.", "lt": "Ta pati bauletto forma, įvairiais atspalviais. Tas pats kirpimas, ta pati ranka — pasirinkite jums tinkantį atspalvį.", "ro": "Aceeași formă bauletto, realizată în nuanțe diferite. Aceeași croială, aceeași mână — alege culoarea care ți se potrivește.", "sq": "E njëjta formë bauletto, e punuar në nuanca të ndryshme. E njëjta prerje, e njëjta dorë — zgjidhni ngjyrën që ju përshtatet.", "bg": "Една и съща форма bauletto, изработена в различни нюанси. Един и същ крой, една и съща ръка — изберете цвета, който ви подхожда."}, "processo_h2_1": {"en": "How a bag", "fr": "Comment naît", "de": "Wie eine Tasche", "es": "Cómo nace", "ru": "Как рождается", "ar": "كيف تولد", "pt": "Como nasce", "zh": "一只包袋", "ja": "バッグが", "ko": "가방이", "uk": "Як народжується", "hr": "Kako nastaje", "pl": "Jak powstaje", "lt": "Kaip gimsta", "ro": "Cum prinde viață", "sq": "Si lind", "bg": "Как се ражда"}, "processo_h2_2": {"en": "comes to life.", "fr": "un sac.", "de": "entsteht.", "es": "un bolso.", "ru": "сумка.", "ar": "الحقيبة.", "pt": "uma mala.", "zh": "如何诞生。", "ja": "生まれるまで。", "ko": "만들어지기까지.", "uk": "сумка.", "hr": "torba.", "pl": "torba.", "lt": "krepšys.", "ro": "o geantă.", "sq": "një çantë.", "bg": "чантата."}, "processo_p": {"en": "Four stages, all in-house. No industrial moulds: every step is checked by hand before moving to the next.", "fr": "Quatre étapes, toutes réalisées à l'atelier. Aucun moule industriel : chaque passage est contrôlé à la main avant de passer au suivant.", "de": "Vier Schritte, alle in der eigenen Werkstatt. Keine industriellen Formen: jeder Arbeitsschritt wird von Hand geprüft, bevor der nächste beginnt.", "es": "Cuatro fases, todas en el taller. Nada de moldes industriales: cada paso se controla a mano antes de pasar al siguiente.", "ru": "Четыре этапа, и все — в мастерской. Никаких промышленных форм: каждый шаг проверяется вручную, прежде чем перейти к следующему.", "ar": "أربع مراحل، كلها داخل الورشة. لا قوالب صناعية: تُراجع كل خطوة يدوياً قبل الانتقال إلى التالية.", "pt": "Quatro fases, todas no ateliê. Sem moldes industriais: cada passo é verificado à mão antes de avançar para o seguinte.", "zh": "四个阶段，全部在工坊内完成。没有工业模具：每一步都经过手工检验，才会进入下一步。", "ja": "すべて工房内で行う4つの工程。工業用の型は使いません：各工程は手作業で確認してから次に進みます。", "ko": "모두 공방 안에서 이루어지는 네 단계. 산업용 몰드는 사용하지 않습니다: 각 단계는 손으로 확인한 후 다음으로 넘어갑니다.", "uk": "Чотири етапи, усі в майстерні. Жодних промислових форм: кожен крок перевіряється вручну, перш ніж перейти до наступного.", "hr": "Četiri faze, sve u radionici. Nema industrijskih kalupa: svaki korak se ručno provjerava prije prelaska na sljedeći.", "pl": "Cztery etapy, wszystkie w pracowni. Żadnych przemysłowych form: każdy krok jest ręcznie sprawdzany, zanim przejdziemy do kolejnego.", "lt": "Keturi etapai, visi dirbtuvėje. Jokių pramoninių formų: kiekvienas žingsnis tikrinamas rankomis prieš pereinant prie kito.", "ro": "Patru etape, toate realizate în atelier. Fără mulaje industriale: fiecare pas este verificat manual înainte de a trece la următorul.", "sq": "Katër faza, të gjitha brenda punishtes. Asnjë kallëp industrial: çdo hap kontrollohet me dorë përpara se të kalohet në tjetrin.", "bg": "Четири етапа, всички в работилницата. Никакви индустриални форми: всяка стъпка се проверява ръчно, преди да се премине към следващата."}, "step1_title": {"en": "Cutting", "fr": "Découpe", "de": "Zuschnitt", "es": "Corte", "ru": "Раскрой", "ar": "القص", "pt": "Corte", "zh": "裁剪", "ja": "裁断", "ko": "재단", "uk": "Розкрій", "hr": "Krojenje", "pl": "Krojenie", "lt": "Kirpimas", "ro": "Croire", "sq": "Prerja", "bg": "Кроене"}, "step1_desc": {"en": "The leather is chosen and cut panel by panel, following the hide's natural grain.", "fr": "Le cuir est choisi et découpé panneau par panneau, en suivant le veinage naturel de la peau.", "de": "Das Leder wird ausgewählt und Stück für Stück zugeschnitten, entlang der natürlichen Maserung des Leders.", "es": "La piel se elige y se corta panel a panel, siguiendo las vetas naturales del cuero.", "ru": "Кожа отбирается и раскраивается панель за панелью, с учётом естественной текстуры материала.", "ar": "يُختار الجلد ويُقص لوحة بلوحة، باتّباع تعرّقاته الطبيعية.", "pt": "A pele é escolhida e cortada painel a painel, seguindo as veias naturais do couro.", "zh": "皮革经过精心挑选，按照皮料的天然纹理逐片裁剪。", "ja": "革を吟味し、革本来の銀面の流れに沿って一枚ずつ裁断します。", "ko": "가죽을 정성껏 선별하여 가죽 고유의 결을 따라 한 조각씩 재단합니다.", "uk": "Шкіру відбирають і розкроюють панель за панеллю, дотримуючись природної текстури матеріалу.", "hr": "Koža se bira i kroji panel po panel, prateći prirodnu teksturu kože.", "pl": "Skóra jest wybierana i krojona panel po panelu, zgodnie z naturalnym usłojeniem materiału.", "lt": "Oda parenkama ir kerpama detalė po detalės, atsižvelgiant į natūralią odos tekstūrą.", "ro": "Pielea este aleasă și tăiată panou cu panou, urmărind granulația naturală a pielii.", "sq": "Lëkura zgjidhet dhe pritet panel pas paneli, duke ndjekur strukturën natyrore të lëkurës.", "bg": "Кожата се подбира и кроява панел по панел, следвайки естествената текстура на материала."}, "step2_title": {"en": "Stitching", "fr": "Couture", "de": "Nähen", "es": "Costura", "ru": "Шитьё", "ar": "الخياطة", "pt": "Costura", "zh": "缝制", "ja": "縫製", "ko": "봉제", "uk": "Шиття", "hr": "Šivanje", "pl": "Szycie", "lt": "Siuvimas", "ro": "Cusut", "sq": "Qepja", "bg": "Шиене"}, "step2_desc": {"en": "Panels are joined with sturdy double-stitching, to bear the weight over time.", "fr": "Les panneaux sont assemblés par une double piqûre à fil résistant, pour supporter le poids dans la durée.", "de": "Die Teile werden mit reißfestem Doppelnahtgarn verbunden, damit sie dauerhaft belastbar bleiben.", "es": "Los paneles se unen con doble pespunte de hilo resistente, para soportar el peso con el tiempo.", "ru": "Панели соединяются прочной двойной строчкой, способной выдерживать нагрузку долгие годы.", "ar": "تُوصَل اللوحات بخياطة مزدوجة بخيط متين، لتتحمّل الوزن مع مرور الوقت.", "pt": "Os painéis são unidos com dupla pesponto de fio resistente, para aguentar o peso ao longo do tempo.", "zh": "各裁片以牢固的双线缝合拼接，经久耐用。", "ja": "パーツは丈夫なダブルステッチで縫い合わせ、長期間の使用に耐えます。", "ko": "각 조각은 튼튼한 이중 스티치로 이어 붙여 오랫동안 견딜 수 있게 합니다.", "uk": "Панелі з'єднують міцною подвійною строчкою, щоб витримувати навантаження з часом.", "hr": "Paneli se spajaju čvrstim dvostrukim šavom, kako bi izdržali težinu tijekom vremena.", "pl": "Panele są łączone mocnym podwójnym szwem, aby wytrzymać obciążenie przez lata.", "lt": "Detalės sujungiamos tvirtu dvigubu siūlu, kad atlaikytų svorį ilgą laiką.", "ro": "Panourile sunt îmbinate cu o cusătură dublă rezistentă, pentru a susține greutatea în timp.", "sq": "Panelet bashkohen me qepje të dyfishtë të fortë, për të mbajtur peshën me kalimin e kohës.", "bg": "Панелите се съединяват с здрав двоен шев, за да издържат тежестта с течение на времето."}, "step3_title": {"en": "Studding", "fr": "Cloutage", "de": "Beschlagen", "es": "Tachuelas", "ru": "Фурнитура", "ar": "التركيب", "pt": "Rebitagem", "zh": "铆钉装配", "ja": "金具付け", "ko": "장식 부착", "uk": "Фурнітура", "hr": "Postavljanje okova", "pl": "Nitowanie", "lt": "Furnitūros tvirtinimas", "ro": "Montarea accesoriilor", "sq": "Vendosja e aksesorëve", "bg": "Монтаж на фурнитура"}, "step3_desc": {"en": "Studs, buckles and rings in antiqued brass are applied by hand, one by one.", "fr": "Clous, boucles et anneaux en laiton vieilli sont posés à la main, un par un.", "de": "Nieten, Schnallen und Ringe aus gealtertem Messing werden von Hand angebracht, Stück für Stück.", "es": "Tachuelas, hebillas y anillas de latón envejecido se aplican a mano, una a una.", "ru": "Заклёпки, пряжки и кольца из состаренной латуни устанавливаются вручную, одна за другой.", "ar": "تُركَّب المسامير والإبازيم والحلقات النحاسية العتيقة يدوياً، واحدة تلو الأخرى.", "pt": "Rebites, fivelas e argolas em latão envelhecido são aplicados à mão, um a um.", "zh": "做旧黄铜铆钉、扣环与圆环，逐一手工安装。", "ja": "アンティーク仕上げの真鍮製鋲、バックル、リングを一つひとつ手作業で取り付けます。", "ko": "앤틱 황동 스터드, 버클, 링을 하나하나 손으로 부착합니다.", "uk": "Заклепки, пряжки та кільця з латуні під старовину встановлюють вручну, одне за одним.", "hr": "Zakovice, kopče i prstenovi od mjedi s patinom postavljaju se ručno, jedan po jedan.", "pl": "Nity, klamry i kółka z postarzanego mosiądzu są mocowane ręcznie, jeden po drugim.", "lt": "Sendinto žalvario kniedės, sagtys ir žiedai tvirtinami rankomis, po vieną.", "ro": "Nituri, catarame și inele din alamă patinată sunt aplicate manual, unul câte unul.", "sq": "Kunjat, tokëzat dhe unazat prej tunxhi të vjetëruar vendosen me dorë, një nga një.", "bg": "Нитове, катарами и халки от месинг с патина се поставят ръчно, един по един."}, "step4_title": {"en": "Finishing", "fr": "Finition", "de": "Veredelung", "es": "Acabado", "ru": "Отделка", "ar": "اللمسات الأخيرة", "pt": "Acabamento", "zh": "精加工", "ja": "仕上げ", "ko": "마무리", "uk": "Оздоблення", "hr": "Završna obrada", "pl": "Wykończenie", "lt": "Apdaila", "ro": "Finisare", "sq": "Finalizimi", "bg": "Завършителна обработка"}, "step4_desc": {"en": "Edges polished with wax, a final check on every seam, then packed in-house.", "fr": "Bords lustrés à la cire, contrôle final de chaque couture et emballage à l'atelier.", "de": "Kanten werden mit Wachs poliert, jede Naht wird abschließend geprüft und in der Werkstatt verpackt.", "es": "Bordes pulidos con cera, control final de cada costura y embalaje en el taller.", "ru": "Края полируются воском, каждый шов проходит финальную проверку, упаковка — в мастерской.", "ar": "تُصقَل الحواف بالشمع، وتخضع كل خياطة لفحص نهائي، ثم التغليف داخل الورشة.", "pt": "Bordas polidas com cera, verificação final de cada costura e embalagem no ateliê.", "zh": "边缘以蜡打磨抛光，逐条缝线最终检验，随后在工坊内包装。", "ja": "エッジをワックスで磨き上げ、すべての縫い目を最終チェックしたのち、工房内で梱包します。", "ko": "가장자리를 왁스로 광택 내고, 모든 박음질을 최종 검수한 후 공방에서 포장합니다.", "uk": "Краї полірують воском, кожен шов проходить фінальну перевірку, після чого пакування здійснюється в майстерні.", "hr": "Rubovi se poliraju voskom, svaki šav prolazi završnu provjeru, a zatim se pakira u radionici.", "pl": "Krawędzie są polerowane woskiem, każdy szew przechodzi ostateczną kontrolę, a następnie pakowanie odbywa się w pracowni.", "lt": "Kraštai poliruojami vašku, kiekviena siūlė galutinai patikrinama, o vėliau supakuojama dirbtuvėje.", "ro": "Marginile sunt lustruite cu ceară, fiecare cusătură este verificată final, apoi ambalată în atelier.", "sq": "Skajet lustrohen me dyllë, çdo qepje kontrollohet përfundimisht, më pas paketohet brenda punishtes.", "bg": "Ръбовете се полират с восък, всеки шев преминава окончателна проверка, след което опаковането се извършва в работилницата."}, "bottega_eyebrow": {"en": "The workshop", "fr": "L'atelier", "de": "Die Werkstatt", "es": "El taller", "ru": "Мастерская", "ar": "الورشة", "pt": "O ateliê", "zh": "工坊", "ja": "工房", "ko": "공방", "uk": "Майстерня", "hr": "Radionica", "pl": "Pracownia", "lt": "Dirbtuvė", "ro": "Atelierul", "sq": "Punishtja", "bg": "Работилница"}, "bottega_quote": {"en": "“We don't mass-produce bags: every hide has its own grain, every bag its own character.”", "fr": "« Nous ne produisons pas de sacs en série : chaque peau a son veinage, chaque sac son caractère. »", "de": "„Wir stellen keine Taschen in Serie her: jedes Leder hat seine eigene Maserung, jede Tasche ihren eigenen Charakter.“", "es": "«No producimos bolsos en serie: cada piel tiene sus vetas, cada bolso su carácter.»", "ru": "«Мы не производим сумки серийно: у каждой кожи свой рисунок, у каждой сумки — свой характер».", "ar": "«لا نصنع الحقائب بشكل تسلسلي: لكل جلد تعرّقاته الخاصة، ولكل حقيبة طابعها المميز.»", "pt": "«Não produzimos malas em série: cada pele tem as suas veias, cada mala o seu caráter.»", "zh": "「我们不批量生产包袋：每张皮革都有自己的纹理，每只包袋都有自己的个性。」", "ja": "「私たちはバッグを大量生産しません：革にはそれぞれの銀面があり、バッグにはそれぞれの個性があります。」", "ko": "「우리는 가방을 대량 생산하지 않습니다. 모든 가죽에는 고유한 결이, 모든 가방에는 고유한 개성이 있습니다.」", "uk": "«Ми не виробляємо сумки серійно: кожна шкіра має свою текстуру, кожна сумка — свій характер.»", "hr": "„Mi ne proizvodimo torbe serijski: svaka koža ima svoju teksturu, svaka torba svoj karakter.“", "pl": "„Nie produkujemy toreb seryjnie: każda skóra ma swoją fakturę, każda torba swój charakter”.", "lt": "„Mes negaminame krepšių serijiniu būdu: kiekviena oda turi savo tekstūrą, kiekvienas krepšys – savo charakterį.“", "ro": "„Nu producem genți în serie: fiecare piele are propria granulație, fiecare geantă propriul caracter.”", "sq": "«Ne nuk prodhojmë çanta në seri: çdo lëkurë ka strukturën e vet, çdo çantë ka karakterin e vet.»", "bg": "„Ние не произвеждаме чанти серийно: всяка кожа има своя текстура, всяка чанта — свой характер.“"}, "bottega_p1": {"en": "We work small batches of vegetable-tanned leather, chosen piece by piece before cutting. It's a hide that marks with use and shifts tone slightly over time — not a flaw, but the leather coming alive.", "fr": "Nous travaillons de petits lots de cuir tanné végétal, sélectionnés pièce par pièce avant la découpe. C'est un cuir qui se marque avec l'usage et change légèrement de teinte avec le temps — ce n'est pas un défaut, c'est la peau qui vit.", "de": "Wir verarbeiten kleine Chargen pflanzlich gegerbten Leders, die vor dem Zuschnitt Stück für Stück ausgewählt werden. Dieses Leder zeichnet sich mit der Nutzung und verändert im Laufe der Zeit leicht seinen Ton — kein Makel, sondern Ausdruck eines lebendigen Materials.", "es": "Trabajamos pequeños lotes de piel curtida al vegetal, elegida pieza por pieza antes del corte. Es un cuero que se marca con el uso y cambia ligeramente de tono con el tiempo — no es un defecto, es la piel que vive.", "ru": "Мы работаем с небольшими партиями кожи растительного дубления, отбирая каждый кусок вручную перед раскроем. Эта кожа со временем покрывается патиной и слегка меняет оттенок — это не дефект, а признак того, что кожа живёт.", "ar": "نعمل بدفعات صغيرة من الجلد المدبوغ نباتياً، يُختار قطعة قطعة قبل القص. إنه جلد يترك أثراً مع الاستخدام ويتغيّر لونه قليلاً مع الوقت — ليس عيباً، بل دليلاً على حيوية الجلد.", "pt": "Trabalhamos pequenos lotes de pele curtida ao vegetal, escolhida peça a peça antes do corte. É um couro que se marca com o uso e muda ligeiramente de tom com o tempo — não é um defeito, é a pele que vive.", "zh": "我们使用少量精选的植鞣皮革，在裁剪前逐张挑选。这种皮革会随着使用留下印记，色泽也会随时间略有变化——这不是瑕疵，而是皮革在“生长”。", "ja": "私たちは、裁断前に一枚ずつ選び抜いた植物タンニンなめしの革を、少量ずつ扱っています。この革は使うほどに味わいが増し、時間とともにわずかに色合いが変化します——それは欠陥ではなく、革が生きている証です。", "ko": "저희는 재단 전에 한 장씩 선별한 식물성 무두질 가죽을 소량으로 다룹니다. 이 가죽은 사용할수록 자국이 남고 시간이 지나면서 색이 미세하게 변합니다 — 결함이 아니라 가죽이 살아있다는 증거입니다.", "uk": "Ми працюємо з невеликими партіями шкіри рослинного дублення, відібраної поштучно перед розкроєм. Ця шкіра з часом набуває слідів використання й трохи змінює відтінок — це не дефект, а ознака того, що шкіра «живе».", "hr": "Radimo s malim serijama biljno štavljene kože, birane komad po komad prije krojenja. To je koža koja se obilježava upotrebom i s vremenom lagano mijenja ton — nije to mana, već znak da je koža živa.", "pl": "Pracujemy na małych partiach skóry garbowanej roślinnie, wybieranej sztuka po sztuce przed krojeniem. To skóra, która znaczy się podczas użytkowania i z czasem lekko zmienia odcień — to nie wada, lecz dowód, że skóra żyje.", "lt": "Dirbame su nedidelėmis augalinio raugimo odos partijomis, atrenkamomis po vieną prieš kerpant. Tai oda, kuri naudojant įgauna žymes ir laikui bėgant šiek tiek keičia atspalvį — tai nėra defektas, o įrodymas, kad oda gyva.", "ro": "Lucrăm cu loturi mici de piele tăbăcită vegetal, aleasă bucată cu bucată înainte de croire. Este o piele care se marchează în timpul utilizării și își schimbă ușor nuanța în timp — nu este un defect, ci semnul că pielea este vie.", "sq": "Ne punojmë me sasi të vogla lëkure të regjur me lëndë bimore, të zgjedhur copë për copë përpara prerjes. Është një lëkurë që lë gjurmë me përdorimin dhe ndryshon lehtë tonin me kalimin e kohës — nuk është defekt, por shenjë se lëkura është e gjallë.", "bg": "Работим с малки партиди растително дъбена кожа, подбирана парче по парче преди кроенето. Това е кожа, която се маркира с употреба и леко променя тона си с времето — това не е дефект, а доказателство, че кожата е жива."}, "bottega_p2": {"en": "Studs, buckles and rings are in antiqued brass, applied by hand: that's why no two bags of the same model are ever perfectly identical.", "fr": "Les clous, les boucles et les anneaux sont en laiton vieilli, posés à la main : c'est pourquoi deux sacs du même modèle ne sont jamais parfaitement identiques.", "de": "Nieten, Schnallen und Ringe sind aus gealtertem Messing und werden von Hand angebracht: Deshalb sind zwei Taschen desselben Modells nie ganz identisch.", "es": "Las tachuelas, hebillas y anillas son de latón envejecido, aplicadas a mano: por eso dos bolsos del mismo modelo nunca son perfectamente idénticos.", "ru": "Заклёпки, пряжки и кольца выполнены из состаренной латуни и устанавливаются вручную: поэтому две сумки одной модели никогда не бывают полностью одинаковыми.", "ar": "المسامير والإبازيم والحلقات من النحاس العتيق، تُركَّب يدوياً: لهذا لا توجد حقيبتان من نفس الموديل متطابقتان تماماً.", "pt": "Os rebites, fivelas e argolas são em latão envelhecido, aplicados à mão: por isso duas malas do mesmo modelo nunca são perfeitamente idênticas.", "zh": "铆钉、扣环与圆环均为做旧黄铜，手工安装：因此即使是同一款式的两只包袋，也绝不会完全相同。", "ja": "鋲、バックル、リングはすべてアンティーク仕上げの真鍮製で、手作業で取り付けています：そのため、同じモデルのバッグでも二つと同じものはありません。", "ko": "스터드, 버클, 링은 모두 앤틱 황동 소재로 손으로 부착합니다. 그래서 같은 모델의 가방이라도 완전히 똑같은 두 개는 없습니다.", "uk": "Заклепки, пряжки та кільця виготовлені з латуні під старовину й встановлюються вручну: саме тому навіть дві сумки однієї моделі ніколи не бувають абсолютно однаковими.", "hr": "Zakovice, kopče i prstenovi su od mjedi s patinom, postavljeni ručno: zato dvije torbe istog modela nikad nisu potpuno identične.", "pl": "Nity, klamry i kółka są z postarzanego mosiądzu, montowane ręcznie: dlatego dwie torby tego samego modelu nigdy nie są idealnie identyczne.", "lt": "Kniedės, sagtys ir žiedai pagaminti iš sendinto žalvario ir tvirtinami rankomis: todėl dvi to paties modelio rankinės niekada nėra visiškai vienodos.", "ro": "Niturile, cataramele și inelele sunt din alamă patinată, aplicate manual: de aceea două genți din același model nu sunt niciodată perfect identice.", "sq": "Kunjat, tokëzat dhe unazat janë prej tunxhi të vjetëruar, të vendosura me dorë: prandaj dy çanta të të njëjtit model nuk janë kurrë plotësisht identike.", "bg": "Нитовете, катарамите и халките са от месинг с патина, монтирани ръчно: затова две чанти от един и същ модел никога не са напълно еднакви."}, "footer_h4_1": {"en": "Write to the workshop", "fr": "Écrivez à l'atelier", "de": "Schreiben Sie der Werkstatt", "es": "Escríbenos al taller", "ru": "Напишите в мастерскую", "ar": "راسل الورشة", "pt": "Escreva ao ateliê", "zh": "联系工坊", "ja": "工房に問い合わせる", "ko": "공방에 문의하기", "uk": "Написати майстерні", "hr": "Pišite radionici", "pl": "Napisz do pracowni", "lt": "Rašyti dirbtuvei", "ro": "Scrie atelierului", "sq": "Shkruani punishtes", "bg": "Пишете на работилницата"}, "footer_note": {"en": "For availability, made-to-measure sizing or custom commissions, write to us directly: we reply in person.", "fr": "Pour la disponibilité, des mesures sur demande ou des commandes personnalisées, écrivez-nous directement : nous répondons en personne.", "de": "Für Verfügbarkeit, Maße auf Anfrage oder individuelle Aufträge schreiben Sie uns direkt: Wir antworten persönlich.", "es": "Para disponibilidad, medidas a petición o encargos personalizados, escríbenos directamente: respondemos en persona.", "ru": "По вопросам наличия, индивидуальных размеров или заказов на изготовление пишите нам напрямую — мы отвечаем лично.", "ar": "للاستفسار عن التوفر، أو مقاسات خاصة، أو طلبات مخصّصة، راسلنا مباشرة: نرد شخصياً.", "pt": "Para disponibilidade, medidas sob encomenda ou encomendas personalizadas, escreva-nos diretamente: respondemos pessoalmente.", "zh": "如需了解库存情况、定制尺寸或个性化定制，请直接与我们联系：我们将亲自回复。", "ja": "在庫状況、サイズオーダーやオーダーメイドのご相談は、直接お問い合わせください：担当者が直接ご返信いたします。", "ko": "재고 확인, 맞춤 사이즈 또는 커스텀 주문에 대해서는 저희에게 직접 문의해 주세요: 담당자가 직접 답변드립니다.", "uk": "Щодо наявності, індивідуальних розмірів чи замовлень на виготовлення пишіть нам напряму: відповідаємо особисто.", "hr": "Za dostupnost, mjere po mjeri ili narudžbe po mjeri, pišite nam izravno: odgovaramo osobno.", "pl": "W sprawie dostępności, wymiarów na zamówienie lub zamówień personalizowanych napisz do nas bezpośrednio: odpowiadamy osobiście.", "lt": "Dėl prieinamumo, individualių matmenų ar užsakomųjų d ru": "Итого к оплате: ", "ar": "الإجمالي المستحق: ", "pt": "Total a pagar: ", "zh": "应付总额：", "ja": "お支払い合計金額：", "ko": "결제할 총액: ", "uk": "Сума до сплати: ", "hr": "Ukupno za platiti: ", "pl": "Łącznie do zapłaty: ", "lt": "Bendra mokėtina suma: ", "ro": "Total de plată: ", "sq": "Totali për të paguar: ", "bg": "Обща сума за плащане: "}, "resi_h1": {"en": "Returns & right of withdrawal", "fr": "Retours et droit de rétractation", "de": "Rücksendungen & Widerrufsrecht", "es": "Devoluciones y derecho de desistimiento", "ru": "Возврат и право на отказ от покупки", "ar": "الإرجاع وحق الانسحاب", "pt": "Devoluções e direito de retratação", "zh": "退货与撤回权", "ja": "返品・返金と撤回権", "ko": "반품 및 철회권", "uk": "Повернення та право відмови", "hr": "Povrat i pravo na odustanak", "pl": "Zwroty i prawo odstąpienia", "lt": "Grąžinimas ir teisė atsisakyti", "ro": "Retururi și drept de retragere", "sq": "Kthimet dhe e drejta e tërheqjes", "bg": "Връщане и право на отказ"}, "resi_highlight": {"en": "You have the right to withdraw within <b>14 days</b> of receiving the product, with no need to give a reason. <b>Return shipping costs are the customer's responsibility</b>.", "fr": "Vous disposez d'un droit de rétractation de <b>14 jours</b> à compter de la réception du produit, sans avoir à justifier de motif. <b>Les frais de retour sont à la charge du client</b>.", "de": "Sie haben ein Widerrufsrecht innerhalb von <b>14 Tagen</b> nach Erhalt der Ware, ohne Angabe von Gründen. <b>Die Rücksendekosten trägt der Kunde</b>.", "es": "Tienes derecho de desistimiento en un plazo de <b>14 días</b> desde la recepción del producto, sin necesidad de indicar un motivo. <b>Los gastos de envío de la devolución corren a cargo del cliente</b>.", "ru": "У вас есть право отказаться от покупки в течение <b>14 дней</b> с момента получения товара, без объяснения причин. <b>Расходы по возврату несёт покупатель</b>.", "ar": "يحق لك الانسحاب خلال <b>14 يوماً</b> من استلام المنتج، دون الحاجة لذكر السبب. <b>تكاليف شحن الإرجاع على عاتق العميل</b>.", "pt": "Tem direito de retratação no prazo de <b>14 dias</b> a partir da receção do produto, sem necessidade de indicar um motivo. <b>As despesas de envio da devolução são da responsabilidade do cliente</b>.", "zh": "您有权在收到商品后<b>14天内</b>撤回购买，无需说明理由。<b>退货运费由客户承担</b>。", "ja": "商品受領後<b>14日以内</b>であれば、理由を問わずクーリングオフが可能です。<b>返品送料はお客様のご負担</b>となります。", "ko": "상품 수령 후 <b>14일 이내</b>에 사유 없이 철회할 권리가 있습니다. <b>반품 배송비는 고객 부담</b>입니다.", "uk": "Ви маєте право відмовитися від покупки протягом <b>14 днів</b> з моменту отримання товару, без пояснення причин. <b>Витрати на доставку при поверненні несе клієнт</b>.", "hr": "Imate pravo odustati u roku od <b>14 dana</b> od primitka proizvoda, bez navođenja razloga. <b>Troškove povrata snosi kupac</b>.", "pl": "Masz prawo odstąpić od umowy w ciągu <b>14 dni</b> od otrzymania produktu, bez podawania przyczyny. <b>Koszty zwrotu ponosi klient</b>.", "lt": "Turite teisę atsisakyti pirkimo per <b>14 dienų</b> nuo produkto gavimo, nenurodydami priežasties. <b>Grąžinimo išlaidas padengia klientas</b>.", "ro": "Ai dreptul să te retragi în termen de <b>14 zile</b> de la primirea produsului, fără a indica un motiv. <b>Costurile de returnare sunt suportate de client</b>.", "sq": "Ju keni të drejtën të tërhiqeni brenda <b>14 ditëve</b> nga marrja e produktit, pa dhënë asnjë arsye. <b>Shpenzimet e transportit për kthimin i takojnë klientit</b>.", "bg": "Имате право да се откажете в рамките на <b>14 дни</b> от получаването на продукта, без да посочвате причина. <b>Разходите за връщане са за сметка на клиента</b>."}, "resi_h2_1": {"en": "Right of withdrawal", "fr": "Droit de rétractation", "de": "Widerrufsrecht", "es": "Derecho de desistimiento", "ru": "Право на отказ от покупки", "ar": "حق الانسحاب", "pt": "Direito de retratação", "zh": "撤回权", "ja": "クーリングオフ（撤回権）について", "ko": "철회권", "uk": "Право відмови", "hr": "Pravo na odustanak", "pl": "Prawo odstąpienia", "lt": "Teisė atsisakyti", "ro": "Dreptul de retragere", "sq": "E drejta e tërheqjes", "bg": "Право на отказ"}, "resi_p1": {"en": "If you are a consumer (purchasing for personal use, not as part of a professional activity), you have the right to withdraw from the contract within 14 calendar days from the day you or a third party appointed by you receives the product, without giving any reason and without penalty.", "fr": "Si vous êtes un consommateur (achat à usage personnel, en dehors de toute activité professionnelle), vous disposez d'un droit de rétractation dans un délai de 14 jours calendaires à compter du jour où vous, ou un tiers désigné par vous, recevez le produit, sans avoir à justifier de motif et sans pénalité.", "de": "Wenn Sie Verbraucher sind (Kauf zum persönlichen Gebrauch, nicht im Rahmen einer beruflichen Tätigkeit), haben Sie das Recht, den Vertrag innerhalb von 14 Kalendertagen ab dem Tag zu widerrufen, an dem Sie oder ein von Ihnen benannter Dritter die Ware erhalten hat, ohne Angabe von Gründen und ohne Vertragsstrafe.", "es": "Si eres consumidor (compra para uso personal, fuera del ámbito de una actividad profesional), tienes derecho a desistir del contrato en un plazo de 14 días naturales desde el día en que tú o un tercero designado por ti recibáis el producto, sin necesidad de indicar motivo alguno y sin penalización.", "ru": "Если вы являетесь потребителем (покупка для личного использования, вне рамок профессиональной деятельности), вы имеете право отказаться от договора в течение 14 календарных дней со дня получения товара вами или указанным вами третьим лицом, без объяснения причин и без штрафных санкций.", "ar": "إذا كنت مستهلكاً (تشتري للاستخدام الشخصي، وليس ضمن نشاط مهني)، يحق لك الانسحاب من العقد خلال 14 يوماً تقويمياً من يوم استلامك أنت أو طرف ثالث تحدده للمنتج، دون تقديم أي سبب ودون أي غرامة.", "pt": "Se for um consumidor (compra para uso pessoal, fora do âmbito de uma atividade profissional), tem o direito de se retratar do contrato no prazo de 14 dias corridos a partir do dia em que você, ou um terceiro por si designado, receber o produto, sem necessidade de indicar qualquer motivo e sem penalização.", "zh": "如果您是消费者（以个人使用为目的购买，而非职业活动的一部分），您有权在您本人或您指定的第三方收到商品之日起14个自然日内撤回合同，无需说明理由，也无需承担任何罚款。", "ja": "お客様が消費者（職業活動の一環ではなく、個人的な使用を目的として購入された方）である場合、お客様またはお客様が指定した第三者が商品を受け取った日から14暦日以内であれば、理由の如何を問わず、また違約金なしに契約を撤回する権利を有します。", "ko": "고객님이 소비자(직업 활동의 일환이 아닌 개인적인 용도로 구매)인 경우, 고객님 또는 고객님이 지정한 제3자가 상품을 수령한 날로부터 14일(역일 기준) 이내에 사유를 밝히지 않고 위약금 없이 계약을 철회할 권리가 있습니다.", "uk": "Якщо ви є споживачем (купуєте для особистого використання, а не в рамках професійної діяльності), ви маєте право відмовитися від договору протягом 14 календарних днів з дня, коли ви або визначена вами третя особа отримали товар, без пояснення причин і без штрафних санкцій.", "hr": "Ako ste potrošač (kupujete za osobnu upotrebu, izvan profesionalne djelatnosti), imate pravo odustati od ugovora u roku od 14 kalendarskih dana od dana kada ste vi ili treća osoba koju ste odredili primili proizvod, bez navođenja razloga i bez ikakve kazne.", "pl": "Jeśli jesteś konsumentem (dokonujesz zakupu na użytek osobisty, poza działalnością zawodową), masz prawo odstąpić od umowy w ciągu 14 dni kalendarzowych od dnia, w którym Ty lub wskazana przez Ciebie osoba trzecia otrzymaliście produkt, bez podawania przyczyny i bez żadnej kary.", "lt": "Jei esate vartotojas (perkate asmeniniam naudojimui, o ne profesinei veiklai), turite teisę atsisakyti sutarties per 14 kalendorinių dienų nuo tos dienos, kai jūs arba jūsų nurodytas trečiasis asmuo gavote produktą, nenurodydami priežasties ir be jokios baudos.", "ro": "Dacă ești consumator (achiziționezi pentru uz personal, în afara unei activități profesionale), ai dreptul să te retragi din contract în termen de 14 zile calendaristice de la data la care tu sau un terț desemnat de tine primiți produsul, fără a indica un motiv și fără penalități.", "sq": "Nëse jeni konsumator (blini për përdorim personal, jashtë një aktiviteti profesional), keni të drejtën të tërhiqeni nga kontrata brenda 14 ditëve kalendarike nga dita kur ju ose një palë e tretë e caktuar prej jush merrni produktin, pa dhënë asnjë arsye dhe pa asnjë penalitet.", "bg": "Ако сте потребител (купувате за лично ползване, извън професионална дейност), имате право да се откажете от договора в рамките на 14 календарни дни от деня, в който вие или трето лице, посочено от вас, сте получили продукта, без да посочвате причина и без санкции."}, "resi_h2_2": {"en": "How to exercise your right of withdrawal", "fr": "Comment exercer le droit de rétractation", "de": "Wie Sie Ihr Widerrufsrecht ausüben", "es": "Cómo ejercer el desistimiento", "ru": "Как воспользоваться правом на отказ", "ar": "كيفية ممارسة حق الانسحاب", "pt": "Como exercer a retratação", "zh": "如何行使撤回权", "ja": "撤回権の行使方法", "ko": "철회권 행사 방법", "uk": "Як скористатися правом відмови", "hr": "Kako ostvariti pravo na odustanak", "pl": "Jak skorzystać z prawa odstąpienia", "lt": "Kaip pasinaudoti teise atsisakyti", "ro": "Cum să îți exerciți dreptul de retragere", "sq": "Si të ushtroni të drejtën e tërheqjes", "bg": "Как да упражните правото на отказ"}, "resi_p2a": {"en": "To exercise your right of withdrawal, simply send us written notice within the 14-day period stated above, for example by email or WhatsApp using the contacts at the bottom of this page, clearly stating your intention to withdraw from the purchase and the order number/reference.", "fr": "Pour exercer le droit de rétractation, il suffit de nous envoyer une communication écrite dans le délai de 14 jours indiqué ci-dessus, par exemple par e-mail ou WhatsApp aux contacts indiqués en bas de cette page, en précisant clairement votre volonté de vous rétracter de l'achat et le numéro/référence de la commande.", "de": "Um Ihr Widerrufsrecht auszuüben, genügt es, uns innerhalb der oben genannten Frist von 14 Tagen eine schriftliche Mitteilung zukommen zu lassen, z. B. per E-Mail oder WhatsApp an die unten auf dieser Seite angegebenen Kontakte, mit eindeutiger Angabe Ihres Widerrufswunsches und der Bestellnummer/Referenz.", "es": "Para ejercer el derecho de desistimiento basta con enviarnos una comunicación escrita dentro del plazo de 14 días antes indicado, por ejemplo por correo electrónico o WhatsApp a los contactos indicados al final de esta página, señalando claramente la voluntad de desistir de la compra y el número/referencia del pedido.", "ru": "Чтобы воспользоваться правом на отказ, достаточно направить нам письменное уведомление в течение указанного выше 14-дневного срока, например по электронной почте или в WhatsApp по контактам, указанным внизу этой страницы, чётко указав намерение отказаться от покупки и номер/референс заказа.", "ar": "لممارسة حق الانسحاب، يكفي إرسال إشعار كتابي خلال مهلة الـ14 يوماً المذكورة أعلاه، مثلاً عبر البريد الإلكتروني أو واتساب على بيانات التواصل أسفل هذه الصفحة، مع توضيح رغبتك في الانسحاب من الشراء ورقم/مرجع الطلب.", "pt": "Para exercer o direito de retratação basta enviar-nos uma comunicação escrita dentro do prazo de 14 dias acima indicado, por exemplo por e-mail ou WhatsApp através dos contactos no final desta página, indicando claramente a vontade de se retratar da compra e o número/referência da encomenda.", "zh": "如需行使撤回权，只需在上述14天期限内以书面形式通知我们即可，例如通过本页底部提供的邮箱或WhatsApp联系方式，明确说明您撤回购买的意愿及订单号/参考编号。", "ja": "撤回権を行使するには、上記の14日間の期限内に、このページ下部に記載のメールまたはWhatsAppの連絡先へ、購入を撤回する意思とご注文番号／参照番号を明記のうえ、書面にてご連絡いただくだけで結構です。", "ko": "철회권을 행사하려면 위에 명시된 14일 기한 내에 서면으로 통지하시면 됩니다. 예를 들어 이 페이지 하단에 있는 이메일 또는 WhatsApp 연락처로 구매 철회 의사와 주문 번호/참조 번호를 명확히 밝혀 알려 주십시오.", "uk": "Щоб скористатися правом відмови, достатньо надіслати нам письмове повідомлення протягом зазначеного вище 14-денного строку, наприклад електронною поштою або через WhatsApp за контактами внизу цієї сторінки, чітко вказавши намір відмовитися від покупки та номер/референс замовлення.", "hr": "Za ostvarivanje prava na odustanak dovoljno je poslati nam pisanu obavijest u navedenom roku od 14 dana, primjerice putem e-maila ili WhatsAppa na kontakte navedene na dnu ove stranice, jasno navodeći namjeru odustajanja od kupnje te broj/referencu narudžbe.", "pl": "Aby skorzystać z prawa odstąpienia, wystarczy wysłać nam pisemne powiadomienie w ciągu wskazanych powyżej 14 dni, na przykład e-mailem lub przez WhatsApp na dane kontaktowe podane na dole tej strony, jasno określając chęć odstąpienia od zakupu oraz numer/referencję zamówienia.", "lt": "Norėdami pasinaudoti teise atsisakyti, tiesiog atsiųskite mums rašytinį pranešimą per nurodytą 14 dienų laikotarpį, pavyzdžiui, el. paštu arba per WhatsApp šio puslapio apačioje nurodytais kontaktais, aiškiai nurodydami ketinimą atsisakyti pirkimo ir užsakymo numerį/nuorodą.", "ro": "Pentru a-ți exercita dreptul de retragere, este suficient să ne trimiți o notificare scrisă în termenul de 14 zile menționat mai sus, de exemplu prin e-mail sau WhatsApp la contactele indicate în partea de jos a acestei pagini, precizând clar intenția de a te retrage din achiziție și numărul/referința comenzii.", "sq": "Për të ushtruar të drejtën e tërheqjes, mjafton të na dërgoni një njoftim me shkrim brenda afatit 14-ditor të përmendur më sipër, për shembull me email ose WhatsApp te kontaktet në fund të kësaj faqeje, duke shprehur qartë dëshirën për t'u tërhequr nga blerja dhe numrin/referencën e porosisë.", "bg": "За да упражните правото си на отказ, е достатъчно да ни изпратите писмено уведомление в рамките на посочения по-горе 14-дневен срок, например по имейл или WhatsApp на контактите в долната част на тази страница, като ясно посочите намерението си да се откажете от покупката и номера/референцията на поръчката."}, "resi_p2b": {"en": "After notifying us of your withdrawal, you have a further 14 days to send the product back to us.", "fr": "Après nous avoir communiqué votre rétractation, vous disposez de 14 jours supplémentaires pour nous renvoyer le produit.", "de": "Nach der Widerrufsmitteilung haben Sie weitere 14 Tage Zeit, um uns das Produkt zurückzusenden.", "es": "Tras la comunicación del desistimiento, dispones de otros 14 días para devolvernos el producto.", "ru": "После уведомления об отказе у вас есть ещё 14 дней, чтобы отправить нам товар обратно.", "ar": "بعد إشعارنا بالانسحاب، لديك 14 يوماً إضافياً لإعادة إرسال المنتج إلينا.", "pt": "Após a comunicação da retratação, dispõe de mais 14 dias para nos devolver o produto.", "zh": "通知我们撤回后，您还有14天时间将商品退回给我们。", "ja": "撤回のご連絡をいただいた後、商品のご返送にはさらに14日間の猶予があります。", "ko": "철회 통지를 하신 후, 상품을 저희에게 반송할 수 있는 기간이 14일 더 주어집니다.", "uk": "Після повідомлення нам про відмову у вас є ще 14 днів, щоб надіслати товар назад.", "hr": "Nakon što nas obavijestite o odustajanju, imate dodatnih 14 dana za slanje proizvoda natrag.", "pl": "Po powiadomieniu nas o odstąpieniu masz kolejne 14 dni na odesłanie produktu.", "lt": "Pranešę mums apie atsisakymą, turite dar 14 dienų produktui grąžinti.", "ro": "După ce ne notifici retragerea, ai încă 14 zile pentru a ne trimite produsul înapoi.", "sq": "Pas njoftimit tonë për tërheqjen, keni edhe 14 ditë të tjera për të na dërguar prapa produktin.", "bg": "След като ни уведомите за отказа, разполагате с още 14 дни, за да ни изпратите обратно продукта."}, "resi_h2_3": {"en": "Return shipping costs", "fr": "Frais de retour", "de": "Rücksendekosten", "es": "Gastos de devolución", "ru": "Расходы на возврат", "ar": "تكاليف شحن الإرجاع", "pt": "Despesas de devolução", "zh": "退货运费", "ja": "返品送料について", "ko": "반품 배송비", "uk": "Витрати на доставку при поверненні", "hr": "Troškovi povrata", "pl": "Koszty zwrotu", "lt": "Grąžinimo išlaidos", "ro": "Costurile de returnare", "sq": "Shpenzimet e kthimit", "bg": "Разходи за връщане"}, "resi_p3": {"en": "The direct cost of returning the product is <b>the customer's responsibility</b>. We recommend using a trackable shipping method and keeping proof of postage until you receive your refund.", "fr": "Les frais directs d'expédition pour le retour du produit sont <b>à la charge du client</b>. Nous vous conseillons d'utiliser un envoi avec suivi et de conserver la preuve d'expédition jusqu'à réception du remboursement.", "de": "Die direkten Versandkosten für die Rücksendung des Produkts trägt <b>der Kunde</b>. Wir empfehlen, eine Sendung mit Sendungsverfolgung zu nutzen und den Versandbeleg bis zum Erhalt der Rückerstattung aufzubewahren.", "es": "Los gastos directos de envío para la devolución del producto corren <b>a cargo del cliente</b>. Te recomendamos utilizar un envío con seguimiento y conservar el justificante de envío hasta recibir el reembolso.", "ru": "Прямые расходы на отправку возвращаемого товара несёт <b>покупатель</b>. Рекомендуем использовать отправление с отслеживанием и сохранять квитанцию до получения возврата средств.", "ar": "تكاليف الشحن المباشرة لإعادة المنتج تقع <b>على عاتق العميل</b>. ننصح باستخدام شحنة قابلة للتتبع والاحتفاظ بإثبات الشحن حتى استلام المبلغ المسترد.", "pt": "As despesas diretas de envio para a devolução do produto são <b>da responsabilidade do cliente</b>. Recomendamos usar um envio rastreável e guardar o comprovativo até receber o reembolso.", "zh": "退货的直接运费<b>由客户承担</b>。我们建议使用可追踪的物流方式，并在收到退款前保留寄件凭证。", "ja": "商品返送にかかる直接送料は<b>お客様のご負担</b>となります。追跡可能な発送方法をご利用いただき、返金を受け取るまで発送証明を保管されることをお勧めします。", "ko": "상품 반품에 따른 직접 배송비는 <b>고객 부담</b>입니다. 추적 가능한 배송 방법을 이용하시고, 환불을 받으실 때까지 발송 증빙을 보관하실 것을 권장합니다.", "uk": "Прямі витрати на повернення товару <b>несе клієнт</b>. Рекомендуємо використовувати відправлення з відстеженням і зберігати підтвердження відправки до отримання повернення коштів.", "hr": "Izravne troškove povrata proizvoda <b>snosi kupac</b>. Preporučujemo korištenje pošiljke s praćenjem i čuvanje dokaza o slanju do primitka povrata sredstava.", "pl": "Bezpośrednie koszty zwrotu produktu ponosi <b>klient</b>. Zalecamy skorzystanie z przesyłki z możliwością śledzenia i zachowanie dowodu nadania do momentu otrzymania zwrotu.", "lt": "Tiesiogines produkto grąžinimo išlaidas padengia <b>klientas</b>. Rekomenduojame naudoti siuntą su sekimo galimybe ir saugoti siuntimo įrodymą, kol gausite grąžinamą sumą.", "ro": "Costurile directe de returnare a produsului sunt suportate de <b>client</b>. Recomandăm folosirea unei expedieri cu urmărire și păstrarea dovezii de expediere până la primirea rambursării.", "sq": "Shpenzimet direkte të transportit për kthimin e produktit i takojnë <b>klientit</b>. Rekomandojmë përdorimin e një dërgese të gjurmueshme dhe ruajtjen e provës së dërgimit deri në marrjen e rimbursimit.", "bg": "Директните разходи за връщане на продукта са за сметка на <b>клиента</b>. Препоръчваме използването на проследима пратка и запазване на доказателство за изпращане до получаване на възстановената сума."}, "resi_h2_4": {"en": "Condition of the returned product", "fr": "État du produit retourné", "de": "Zustand der zurückgesendeten Ware", "es": "Estado del producto devuelto", "ru": "Состояние возвращаемого товара", "ar": "حالة المنتج المُرجَع", "pt": "Estado do produto devolvido", "zh": "退回商品的状态", "ja": "返品商品の状態について", "ko": "반품 상품의 상태", "uk": "Стан поверненого товару", "hr": "Stanje vraćenog proizvoda", "pl": "Stan zwracanego produktu", "lt": "Grąžinamo produkto būklė", "ro": "Starea produsului returnat", "sq": "Gjendja e produktit të kthyer", "bg": "Състояние на върнатия продукт"}, "resi_li1": {"en": "The product must be returned intact, unused and in the condition in which it was received.", "fr": "Le produit doit être retourné intact, non utilisé et dans l'état dans lequel il a été reçu.", "de": "Das Produkt muss unbeschädigt, unbenutzt und in dem Zustand zurückgesendet werden, in dem es empfangen wurde.", "es": "El producto debe devolverse íntegro, sin usar y en las condiciones en que fue recibido.", "ru": "Товар должен быть возвращён в целостности, неиспользованным и в том состоянии, в котором был получен.", "ar": "يجب إعادة المنتج سليماً وغير مستخدم وبنفس الحالة التي استُلم بها.", "pt": "O produto deve ser devolvido intacto, não utilizado e nas condições em que foi recebido.", "zh": "商品必须完好、未使用，并保持收到时的原始状态退回。", "ja": "商品は未使用かつ受け取った時の状態のまま、無傷で返送してください。", "ko": "상품은 손상 없이, 사용하지 않은 상태로, 수령 당시의 상태 그대로 반품해야 합니다.", "uk": "Товар необхідно повернути в цілісному, невикористаному стані, у тому вигляді, в якому він був отриманий.", "hr": "Proizvod se mora vratiti netaknut, nekorišten i u stanju u kojem je primljen.", "pl": "Produkt musi zostać zwrócony nienaruszony, nieużywany i w stanie, w jakim został otrzymany.", "lt": "Produktas turi būti grąžintas nepažeistas, nenaudotas ir tokios būklės, kokios buvo gautas.", "ro": "Produsul trebuie returnat intact, nefolosit și în starea în care a fost primit.", "sq": "Produkti duhet të kthehet i paprekur, i papërdorur dhe në gjendjen në të cilën është marrë.", "bg": "Продуктът трябва да бъде върнат непокътнат, неизползван и в състоянието, в което е получен."}, "resi_li2": {"en": "If possible, keep the packaging, tags and any original wrapping.", "fr": "Si possible, conservez l'emballage, les étiquettes et l'éventuel emballage d'origine.", "de": "Bewahren Sie nach Möglichkeit die Verpackung, Etiketten und die eventuelle Originalverpackung auf.", "es": "Si es posible, conserva el embalaje, las etiquetas y el envoltorio original.", "ru": "По возможности сохраняйте упаковку, бирки и оригинальную обёртку.", "ar": "إن أمكن، احتفظ بالتغليف والبطاقات وأي عبوة أصلية.", "pt": "Se possível, guarde a embalagem, etiquetas e eventual embalagem original.", "zh": "如有可能，请保留包装、吊牌及任何原始包装材料。", "ja": "可能であれば、パッケージ、タグ、オリジナルの包装材を保管しておいてください。", "ko": "가능하다면 포장, 태그 및 원래의 포장재를 보관해 주세요.", "uk": "Якщо можливо, зберігайте упаковку, бирки та будь-яку оригінальну обгортку.", "hr": "Ako je moguće, sačuvajte ambalažu, etikete i eventualno originalno pakiranje.", "pl": "Jeśli to możliwe, zachowaj opakowanie, metki i ewentualne oryginalne pudełko.", "lt": "Jei įmanoma, išsaugokite pakuotę, etiketes ir originalų įpakavimą.", "ro": "Dacă este posibil, păstrează ambalajul, etichetele și eventualul ambalaj original.", "sq": "Nëse është e mundur, ruani paketimin, etiketat dhe çdo mbështjellje origjinale.", "bg": "Ако е възможно, запазете опаковката, етикетите и всякаква оригинална опаковка."}, "resi_li3": {"en": "A reduction in the product's value due to handling beyond what is necessary to check its nature, characteristics and function may result in a proportional deduction from the refund.", "fr": "Une diminution de la valeur du produit due à une manipulation autre que celle nécessaire pour établir la nature, les caractéristiques et le bon fonctionnement du produit peut entraîner une retenue proportionnelle sur le remboursement.", "de": "Eine Wertminderung der Ware, die auf einen Umgang zurückzuführen ist, der über das zur Prüfung von Beschaffenheit, Eigenschaften und Funktionsweise notwendige Maß hinausgeht, kann zu einem anteiligen Abzug von der Rückerstattung führen.", "es": "Una disminución del valor del producto debida a una manipulación distinta de la necesaria para comprobar su naturaleza, características y funcionamiento puede suponer una retención proporcional en el reembolso.", "ru": "Снижение стоимости товара из-за обращения с ним сверх необходимого для проверки его свойств, характеристик и работы может повлечь пропорциональное удержание из суммы возврата.", "ar": "أي انخفاض في قيمة المنتج ناتج عن استخدام يتجاوز ما هو ضروري للتحقق من طبيعته وخصائصه وعمله قد يؤدي إلى خصم متناسب من المبلغ المسترد.", "pt": "Uma diminuição do valor do produto devido a um manuseamento diferente do necessário para verificar a sua natureza, características e funcionamento pode implicar uma retenção proporcional no reembolso.", "zh": "如商品因超出核实其性质、特性及功能所需的操作范围而导致价值降低，可能会从退款中按比例扣除相应金额。", "ja": "商品の性質、特性、機能を確認するために必要な範囲を超える取り扱いにより商品価値が低下した場合、返金額から相応の金額が差し引かれることがあります。", "ko": "상품의 성질, 특성 및 기능을 확인하는 데 필요한 범위를 넘어서는 취급으로 인해 상품 가치가 감소한 경우, 환불액에서 그에 상응하는 금액이 차감될 수 있습니다.", "uk": "Зменшення вартості товару через поводження з ним понад те, що необхідно для перевірки його природи, характеристик і функціонування, може призвести до пропорційного відрахування від суми повернення.", "hr": "Smanjenje vrijednosti 料は返金の対象外です。", "ko": "반품된 상품을 수령한 후(발송 증빙 수령이 더 빠른 경우 그 시점부터), 별도의 합의가 없는 한 구매 시 사용한 것과 동일한 결제 수단으로 14일 이내에 상품 대금을 환불해 드립니다. 최초(발송) 배송비는 환불되지 않습니다.", "uk": "Після отримання поверненого товару (або підтвердження відправки, якщо воно надійде раніше) ми повернемо сплачену за товар суму протягом 14 днів, використовуючи той самий спосіб оплати, що й під час покупки, якщо не домовлено інакше. Початкові витрати на доставку (в один бік) не підлягають поверненню.", "hr": "Nakon što primimo vraćeni proizvod (ili dokaz o slanju, ako je raniji), izvršit ćemo povrat plaćenog iznosa za proizvod u roku od 14 dana, koristeći isti način plaćanja koji je korišten prilikom kupnje, osim ako nije drugačije dogovoreno. Početni troškovi dostave (u jednom smjeru) nisu povratni.", "pl": "Po otrzymaniu zwróconego produktu (lub dowodu nadania, jeśli wpłynie wcześniej) zwrócimy kwotę zapłaconą za produkt w ciągu 14 dni, tą samą metodą płatności, która została użyta przy zakupie, chyba że uzgodniono inaczej. Pierwotne koszty wysyłki (w jedną stronę) nie podlegają zwrotowi.", "lt": "Gavę grąžintą produktą (arba siuntimo įrodymą, jei jis gaunamas anksčiau), grąžinsime už produktą sumokėtą sumą per 14 dienų, naudodami tą patį mokėjimo būdą, kuris buvo naudotas perkant, nebent susitarta kitaip. Pradinės pristatymo išlaidos (į vieną pusę) negrąžinamos.", "ro": "Odată ce primim produsul returnat (sau dovada expedierii, dacă este anterioară), vom rambursa suma plătită pentru produs în termen de 14 zile, folosind aceeași metodă de plată utilizată la achiziție, cu excepția cazului în care s-a convenit altfel. Costurile inițiale de livrare (dus) nu sunt rambursabile.", "sq": "Sapo të marrim produktin e kthyer (ose provën e dërgimit, nëse është më e hershme), do të rimbursojmë shumën e paguar për produktin brenda 14 ditëve, duke përdorur të njëjtën metodë pagese të përdorur në blerje, përveçse kur është rënë dakord ndryshe. Shpenzimet fillestare të transportit (vajtje) nuk rimbursohen.", "bg": "След като п   modelDescs: {"emily-grande": {"en": "Hand-brushed printed suede leather, padded shoulder handles, front zip pocket with through-studs.", "fr": "Cuir suédé imprimé brossé à la main, anses épaulées matelassées, poche frontale zippée avec clous traversants.", "de": "Handgebürstetes, bedrucktes Wildleder, gepolsterte Schulterhenkel, vordere Reißverschlusstasche mit durchgehenden Nieten.", "es": "Piel de ante estampada cepillada a mano, asas acolchadas al hombro, bolsillo frontal con cremallera y tachuelas pasantes.", "ru": "Тиснёная замша ручной чистки, мягкие плечевые ручки, передний карман на молнии с сквозными заклёпками.", "ar": "جلد سويدي مطبوع مصقول يدوياً، مقابض كتف مبطنة، جيب أمامي بسحاب مع مسامير نافذة.", "pt": "Camurça estampada escovada à mão, alças de ombro acolchoadas, bolso frontal com fecho e rebites passantes.", "zh": "手工刷制印花麂皮，加垫肩背手柄，前置拉链口袋配穿孔铆钉。", "ja": "手ブラッシング仕上げのプリントスエードレザー、パッド入りショルダーハンドル、貫通鋲付きフロントジップポケット。", "ko": "핸드 브러싱 처리된 프린트 스웨이드 가죽, 패딩 숄더 핸들, 관통 스터드가 있는 프론트 지퍼 포켓.", "uk": "Ручної роботи щіткована тиснена замша, м'які плечові ручки з підкладкою, передня кишеня на блискавці зі наскрізними заклепками.", "hr": "Ručno četkana otisnuta antilop koža, podstavljene naramenice, prednji džep na patentni zatvarač s prolaznim zakovicama.", "pl": "Ręcznie szczotkowana zamszowa skóra z nadrukiem, pikowane uchwyty naramienne, przednia kieszeń na zamek z przelotowymi nitami.", "lt": "Rankomis šepetėliu apdorota spausdinta zomša, kimštos peties rankenos, priekinė kišenė su užtrauktuku ir kiaurinėmis kniedėmis.", "ro": "Piele întoarsă imprimată, periată manual, mânere căptușite pentru umăr, buzunar frontal cu fermoar și nituri traversante.", "sq": "Lëkurë zambakë e printuar e furçuar me dorë, doreza supi të mbushura, xhep ballor me zinxhir dhe kunja përshkues.", "bg": "Ръчно четкана щампована велурена кожа, подплатени презраменни дръжки, преден джоб с цип и прободни нитове."}, "emily-small": {"en": "The same craftsmanship as the Emily Large in a more compact size, comfortable in hand or on the shoulder. Hand-brushed suede leather, side fringe and contrast studs.", "fr": "Le même travail que l'Emily Large dans un format plus compact, à porter à la main ou à l'épaule. Cuir suédé brossé à la main, franges latérales et clous contrastés.", "de": "Dieselbe Verarbeitung wie die Emily Large in einer kompakteren Größe, bequem in der Hand oder über der Schulter zu tragen. Handgebürstetes Wildleder, seitliche Fransen und kontrastierende Nieten.", "es": "La misma confección que la Emily Large en un formato más compacto, cómoda de mano o al hombro. Piel de ante cepillada a mano, flecos laterales y tachuelas de contraste.", "ru": "Та же выделка, что у Emily Large, но в более компактном формате — удобна в руке и на плече. Замша ручной чистки, боковая бахрома и контрастные заклёпки.", "ar": "نفس تصنيع Emily Large بحجم أكثر إحكاماً، مريحة باليد أو على الكتف. جلد سويدي مصقول يدوياً، شراشيب جانبية ومسامير متباينة اللون.", "pt": "O mesmo trabalho da Emily Large num formato mais compacto, confortável na mão ou a tiracolo. Camurça escovada à mão, franjas laterais e rebites em contraste.", "zh": "与Emily Large同样的工艺，尺寸更为小巧，手提或肩背皆宜。手工刷制麂皮，侧边流苏与撞色铆钉。", "ja": "Emily Largeと同じ製法をよりコンパクトなサイズで、手持ちでも肩掛けでも快適に。手ブラッシング仕上げのスエードレザー、サイドフリンジとコントラストの鋲。", "ko": "Emily Large와 동일한 장인 기술을 더 컴팩트한 사이즈로, 손에 들거나 어깨에 메기에도 편안합니다. 핸드 브러싱 처리된 스웨이드 가죽, 사이드 프린지와 대비되는 스터드.", "uk": "Та сама майстерність, що й в Emily Large, у більш компактному розмірі, зручна в руці чи на плечі. Щіткована вручну замша, бічна бахрома та контрастні заклепки.", "hr": "Ista izrada kao Emily Large u kompaktnijoj veličini, udobna u ruci ili preko ramena. Ručno četkana antilop koža, bočne rese i kontrastne zakovice.", "pl": "To samo wykonanie co Emily Large w bardziej kompaktowym rozmiarze, wygodna do ręki lub na ramię. Ręcznie szczotkowana zamszowa skóra, boczne frędzle i kontrastowe nity.", "lt": "Tas pats meistriškumas kaip Emily Large, tik kompaktiškesnio dydžio, patogi rankoje ar ant peties. Rankomis šepetėliu apdorota zomša, šoniniai kutai ir kontrastingos kniedės.", "ro": "Aceeași manoperă ca Emily Large, într-un format mai compact, comodă de mână sau la umăr. Piele întoarsă periată manual, franjuri laterale și nituri în contrast.", "sq": "E njëjta mjeshtëri si Emily Large në një madhësi më kompakte, e rehatshme në dorë ose në sup. Lëkurë zambakë e furçuar me dorë, thekë anësore dhe kunja kontrastuese.", "bg": "Същото майсторство като Emily Large в по-компактен размер, удобна в ръка или на рамо. Ръчно четкана велурена кожа, странични ресни и контрастни нитове."}, "emily-mini-suede": {"en": "The same Emily Mini line in a suede version, soft to the touch, with a zipped inside pocket and adjustable, removable shoulder strap.", "fr": "La même ligne Emily Mini dans une version en cuir suédé, douce au toucher, avec poche intérieure zippée et bandoulière réglable et amovible.", "de": "Dieselbe Emily-Mini-Linie in einer Wildleder-Version, weich im Griff, mit innenliegender Reißverschlusstasche und verstellbarem, abnehmbarem Schulterriemen.", "es": "La misma línea Emily Mini en versión de piel de ante, suave al tacto, con bolsillo interior con cremallera y correa ajustable y extraíble.", "ru": "Та же линия Emily Mini в замшевом исполнении, мягкая на ощупь, с внутренним карманом на молнии и регулируемым съёмным плечевым ремнём.", "ar": "نفس تشكيلة Emily Mini بنسخة من الجلد السويدي، ناعمة الملمس، مع جيب داخلي بسحاب وحزام كتف قابل للتعديل والفك.", "pt": "A mesma linha Emily Mini numa versão em camurça, macia ao toque, com bolso interno com fecho e alça ajustável e amovível.", "zh": "与Emily Mini系列相同款式的麂皮版本，触感柔软，配内置拉链口袋及可调节可拆卸肩带。", "ja": "同じEmily Miniラインのスエード版で、手触りが柔らかく、内側ジップポケットと調節・取り外し可能なショルダーストラップ付き。", "ko": "동일한 Emily Mini 라인의 스웨이드 버전으로, 촉감이 부드럽고 내부 지퍼 포켓과 조절 가능한 탈부착 숄더 스트랩이 있습니다.", "uk": "Та сама лінія Emily Mini у замшевому варіанті, м'яка на дотик, із внутрішньою кишенею на блискавці та регульованим знімним ремінцем.", "hr": "Ista linija Emily Mini u antilop verziji, mekana na dodir, s unutarnjim džepom na patentni zatvarač i podesivom, odvojivom naramenicom.", "pl": "Ta sama linia Emily Mini w wersji zamszowej, miękka w dotyku, z wewnętrzną kieszenią na zamek i regulowanym, odpinanym paskiem.", "lt": "Ta pati Emily Mini linija zomšos versijoje, minkšta liestis, su vidine kišene su užtrauktuku ir reguliuojama, nuimama petnešėle.", "ro": "Aceeași linie Emily Mini într-o versiune din piele întoarsă, moale la atingere, cu buzunar interior cu fermoar și curea reglabilă, detașabilă.", "sq": "E njëjta linjë Emily Mini në një version zambakë, e butë në prekje, me xhep të brendshëm me zinxhir dhe rrip të rregullueshëm e të hequshëm.", "bg": "Същата линия Emily Mini във велурена версия, мека на допир, с вътрешен джоб с цип и регулируема, подвижна каишка."}, "emy": {"en": "Hand-held bag in Sauvage leather, clean lines and a soft structure, with a zipped inside pocket and adjustable, removable strap for versatile hand or shoulder wear.", "fr": "Sac à main en cuir Sauvage, lignes épurées et structure souple, avec poche intérieure zippée et bandoulière réglable et amovible pour un usage polyvalent à la main ou à l'épaule.", "de": "Handtasche aus Sauvage-Leder mit klaren Linien und weicher Struktur, mit innenliegender Reißverschlusstasche und verstellbarem, abnehmbarem Riemen für vielseitiges Tragen in der Hand oder über der Schulter.", "es": "Bolso de mano en piel Sauvage, líneas limpias y estructura suave, con bolsillo interior con cremallera y correa ajustable y extraíble para un uso versátil de mano o al hombro.", "ru": "Сумка в руку из кожи Sauvage, чёткие линии и мягкая структура, с внутренним карманом на молнии и регулируемым съёмным ремнём для ношения в руке или на плече.", "ar": "حقيبة يد من جلد Sauvage، بخطوط نظيفة وبنية ناعمة، مع جيب داخلي بسحاب وحزام قابل للتعديل والفك للاستخدام المرن باليد أو على الكتف.", "pt": "Mala de mão em pele Sauvage, linhas limpas e estrutura macia, com bolso interno com fecho e alça ajustável e amovível para um uso versátil na mão ou a tiracolo.", "zh": "Sauvage皮革手提包，线条简约，结构柔软，配内置拉链口袋及可调节可拆卸肩带，手提或肩背皆宜。", "ja": "サバージュレザーのハンドバッグ、すっきりとしたラインと柔らかな構造、内側ジップポケットと調節・取り外し可能なストラップ付きで、手持ちでも肩掛けでも多用途に。", "ko": "소바주 가죽 핸드백, 깔끔한 라인과 부드러운 구조, 내부 지퍼 포켓과 조절 가능한 탈부착 스트랩으로 손에 들거나 어깨에 메는 등 다용도로 사용 가능합니다.", "uk": "Сумка в руку зі шкіри Sauvage, чіткі лінії та м'яка структура, з внутрішньою кишенею на блискавці та регульованим знімним ремінцем для носіння в руці або на плечі.", "hr": "Ručna torba od kože Sauvage, čistih linija i mekane strukture, s unutarnjim džepom na patentni zatvarač i podesivom, odvojivom naramenicom za svestrano nošenje u ruci ili preko ramena.", "pl": "Torba do ręki ze skóry Sauvage, o czystych liniach i miękkiej strukturze, z wewnętrzną kieszenią na zamek i regulowanym, odpinanym paskiem do wszechstronnego noszenia w ręku lub na ramieniu.", "lt": "Rankinė iš Sauvage odos, švarių linijų ir minkštos struktūros, su vidine kišene su užtrauktuku ir reguliuojama, nuimama petnešėle universaliam nešiojimui rankoje ar ant peties.", "ro": "Geantă de mână din piele Sauvage, cu linii curate și structură moale, cu buzunar interior cu fermoar și curea reglabilă, detașabilă, pentru un stil versatil de purtat în mână sau la umăr.", "sq": "Çantë dore prej lëkure Sauvage, me linja të pastra dhe strukturë të butë, me xhep të brendshëm me zinxhir dhe rrip të rregullueshëm e të hequshëm për përdorim të gjithanshëm në dorë ose në sup.", "bg": "Чанта за ръка от кожа Sauvage, с чисти линии и мека структура, с вътрешен джоб с цип и регулируема, подвижна каишка за носене в ръка или на рамо."}, "ely-suede": {"en": "Large shoulder bag in suede leather, soft and roomy, with a zipped inside pocket, phone pocket and central zipped divider. Adjustable handle for comfortable everyday use.", "fr": "Grand sac à l'épaule en cuir suédé, souple et spacieux, avec poche intérieure zippée, poche téléphone et séparateur central zippé. Poignée réglable pour un usage quotidien confortable.", "de": "Große Schultertasche aus Wildleder, weich und geräumig, mit innenliegender Reißverschlusstasche, Handyfach und mittigem Trennfach mit Reißverschluss. Verstellbarer Griff für den bequemen Alltagsgebrauch.", "es": "Bolso de hombro Large en piel de ante, suave y amplio, con bolsillo interior con cremallera, bolsillo para móvil y separador central con cremallera. Asa ajustable para un uso cómodo cada día.", "ru": "Большая сумка на плечо из замши, мягкая и вместительная, с внутренним карманом на молнии, карманом для телефона и центральным разделителем на молнии. Регулируемая ручка для удобного повседневного использования.", "ar": "حقيبة كتف كبيرة من الجلد السويدي، ناعمة وواسعة، مع جيب داخلي بسحاب وجيب للهاتف وفاصل مركزي بسحاب. مقبض قابل للتعديل للاستخدام اليومي المريح.", "pt": "Mala de ombro Large em camurça, macia e espaçosa, com bolso interno com fecho, bolso para telemóvel e divisória central com fecho. Alça ajustável para um uso confortável no dia a dia.", "zh": "麂皮大号肩背包，柔软宽敞，配内置拉链口袋、手机袋及中央拉链隔层。可调节手柄，舒适日常使用。", "ja": "スエードレザーのラージショルダーバッグ、柔らかく大容量で、内側ジップポケット、スマホ用ポケット、中央ジップ仕切り付き。調節可能な持ち手で快適な普段使いに。", "ko": "스웨이드 가죽 라지 숄더백, 부드럽고 넉넉한 공간, 내부 지퍼 포켓, 휴대폰 포켓, 중앙 지퍼 칸막이가 있습니다. 조절 가능한 손잡이로 편안한 일상 사용이 가능합니다.", "uk": "Велика сумка на плече із замші, м'яка та містка, з внутрішньою кишенею на блискавці, кишенею для телефону та центральним розділювачем на блискавці. Регульована ручка для комфортного повсякденного використання.", "hr": "Velika torba preko ramena od antilop kože, mekana i prostrana, s unutarnjim džepom na patentni zatvarač, džepom za mobitel i središnjom pregradom na patentni zatvarač. Podesiva ručka za udobnu svakodnevnu upotrebu.", "pl": "Duża torba na ramię z zamszowej skóry, miękka i pojemna, z wewnętrzną kieszenią na zamek, kieszenią na telefon i środkową przegrodą na zamek. Regulowany uchwyt do wygodnego codziennego użytku.", "lt": "Didelis pečių krepšys iš zomšos, minkštas ir talpus, su vidine kišene su užtrauktuku, kišenėle telefonui ir centriniu skyrikliu su užtrauktuku. Reguliuojama rankena patogiam kasdieniam naudojimui.", "ro": "Geantă mare de umăr din piele întoarsă, moale și încăpătoare, cu buzunar interior cu fermoar, buzunar pentru telefon și despărțitor central cu fermoar. Toartă reglabilă pentru un confort zilnic.", "sq": "Çantë e madhe supi prej lëkure zambakë, e butë dhe hapësinore, me xhep të brendshëm me zinxhir, xhep telefoni dhe ndarës qendror me zinxhir. Dorezë e rregullueshme për përdorim të rehatshëm të përditshëm.", "bg": "Голяма чанта за рамо от велур, мека и вместителна, с вътрешен джоб с цип, джоб за телефон и централен разделител с цип. Регулируема дръжка за удобна ежедневна употреба."}, "ely-martellato": {"en": "Large shoulder bag in hammered leather, structured and hard-wearing, with a zipped inside pocket and central zipped divider. Removable handle, no shoulder strap.", "fr": "Grand sac à l'épaule en cuir martelé, structuré et résistant, avec poche intérieure zippée et séparateur central zippé. Poignée amovible, sans bandoulière.", "de": "Große Schultertasche aus genarbtem Leder, strukturiert und strapazierfähig, mit innenliegender Reißverschlusstasche und mittigem Trennfach mit Reißverschluss. Abnehmbarer Griff, ohne Schulterriemen.", "es": "Bolso de hombro Large en piel martillada, estructurado y resistente, con bolsillo interior con cremallera y separador central con cremallera. Asa extraíble, sin correa.", "ru": "Большая сумка на плечо из кожи с эффектом «молоток», структурированная и износостойкая, с внутренним карманом на молнии и центральным разделителем на молнии. Съёмная ручка, без плечевого ремня.", "ar": "حقيبة كتف كبيرة من جلد مطروق، منظّمة البنية ومتينة، مع جيب داخلي بسحاب وفاصل مركزي بسحاب. مقبض قابل للفك، بدون حزام كتف.", "pt": "Mala de ombro Large em pele martelada, estruturada e resistente, com bolso interno com fecho e divisória central com fecho. Alça amovível, sem correia.", "zh": "锤纹皮革大号肩背包，造型挺括耐用，配内置拉链口袋及中央拉链隔层。手柄可拆卸，不含肩带。", "ja": "ハンマードレザーのラージショルダーバッグ、しっかりとした構造で耐久性が高く、内側ジップポケットと中央ジップ仕切り付き。持ち手は取り外し可能、ショルダーストラップは付属しません。", "ko": "해머드 가죽 라지 숄더백, 구조감 있고 내구성이 뛰어나며, 내부 지퍼 포켓과 중앙 지퍼 칸막이가 있습니다. 탈부착 가능한 손잡이, 숄더 스트랩은 포함되지 않습니다.", "uk": "Велика сумка на плече з тисненої шкіри, структурована та зносостійка, з внутрішньою кишенею на блискавці та центральним розділювачем на блискавці. Знімна ручка, без плечового ременя.", "hr": "Velika torba preko ramena od kovane kože, strukturirana i izdržljiva, s unutarnjim džepom na patentni zatvarač i središnjom pregradom na patentni zatvarač. Odvojiva ručka, bez naramenice.", "pl": "Duża torba na ramię ze skóry młotkowanej, strukturalna i wytrzymała, z wewnętrzną kieszenią na zamek i środkową przegrodą na zamek. Odpinany uchwyt, bez paska na ramię.", "lt": "Didelis pečių krepšys iš kaltos odos, struktūrizuotas ir atsparus dėvėjimui, su vidine kišene su užtrauktuku ir centriniu skyrikliu su užtrauktuku. Nuimama rankena, be petnešėlės.", "ro": "Geantă mare de umăr din piele texturată, structurată și rezistentă, cu buzunar interior cu fermoar și despărțitor central cu fermoar. Toartă detașabilă, fără curea de umăr.", "sq": "Çantë e madhe supi prej lëkure të çekiçuar, e strukturuar dhe e qëndrueshme, me xhep të brendshëm me zinxhir dhe ndarës qendror me zinxhir. Dorezë e hequshme, pa rrip supi.", "bg": "Голяма чанта за рамо от кожа с ефект „чук“, структурирана и износоустойчива, с вътрешен джоб с цип и централен разделител с цип. Подвижна дръжка, без раменна каишка."}},

(function(){
  var I18N = window.EJ_I18N;
  var STORE_KEY = 'ej_lang';

  function getLang(){
    try {
      var saved = localStorage.getItem(STORE_KEY);
      if (saved && I18N.langs.indexOf(saved) !== -1) return saved;
    } catch(e){}
    return 'it';
  }

  function setLang(lang){
    try { localStorage.setItem(STORE_KEY, lang); } catch(e){}
    window.EJ_CURRENT_LANG = lang;
    applyStaticTranslations(lang);
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', I18N.rtlLangs.indexOf(lang) !== -1 ? 'rtl' : 'ltr');
    var sel = document.getElementById('lang-select');
    if (sel && sel.value !== lang) sel.value = lang;
    if (typeof window.EJ_renderModels === 'function') window.EJ_renderModels(lang);
  }
  window.EJ_setLang = setLang;

  function applyStaticTranslations(lang){
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if (!el.hasAttribute('data-i18n-src')) {
        el.setAttribute('data-i18n-src', el.textContent);
      }
      var src = el.getAttribute('data-i18n-src');
      var dict = I18N.ui[key];
      el.textContent = (lang !== 'it' && dict && dict[lang]) ? dict[lang] : src;
    });
    document.querySelectorAll('[data-i18n-color]').forEach(function(el){
      var name = el.getAttribute('data-i18n-color');
      var dict = I18N.colors[name];
      el.textContent = (lang !== 'it' && dict && dict[lang]) ? dict[lang] : name;
    });
    document.querySelectorAll('[data-i18n-alt]').forEach(function(el){
      var key = el.getAttribute('data-i18n-alt');
      if (!el.hasAttribute('data-i18n-alt-src')) {
        el.setAttribute('data-i18n-alt-src', el.getAttribute('alt') || '');
      }
      var src = el.getAttribute('data-i18n-alt-src');
      var dict = I18N.ui[key];
      el.setAttribute('alt', (lang !== 'it' && dict && dict[lang]) ? dict[lang] : src);
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){
      var key = el.getAttribute('data-i18n-html');
      if (!el.hasAttribute('data-i18n-html-src')) {
        el.setAttribute('data-i18n-html-src', el.innerHTML);
      }
      var src = el.getAttribute('data-i18n-html-src');
      var dict = I18N.ui[key];
      el.innerHTML = (lang !== 'it' && dict && dict[lang]) ? dict[lang] : src;
    });
    document.querySelectorAll('[data-i18n-country]').forEach(function(el){
      var name = el.getAttribute('data-i18n-country');
      var dict = I18N.countries[name];
      el.textContent = (lang !== 'it' && dict && dict[lang]) ? dict[lang] : name;
    });
    document.querySelectorAll('[data-i18n-attr-label]').forEach(function(el){
      var key = el.getAttribute('data-i18n-attr-label');
      if (!el.hasAttribute('data-i18n-attr-label-src')) {
        el.setAttribute('data-i18n-attr-label-src', el.getAttribute('label') || '');
      }
      var src = el.getAttribute('data-i18n-attr-label-src');
      var dict = I18N.ui[key];
      el.setAttribute('label', (lang !== 'it' && dict && dict[lang]) ? dict[lang] : src);
    });
    document.querySelectorAll('[data-i18n-attr-placeholder]').forEach(function(el){
      var key = el.getAttribute('data-i18n-attr-placeholder');
      if (!el.hasAttribute('data-i18n-attr-placeholder-src')) {
        el.setAttribute('data-i18n-attr-placeholder-src', el.getAttribute('placeholder') || '');
      }
      var src = el.getAttribute('data-i18n-attr-placeholder-src');
      var dict = I18N.ui[key];
      el.setAttribute('placeholder', (lang !== 'it' && dict && dict[lang]) ? dict[lang] : src);
    });
    try { window.dispatchEvent(new CustomEvent('ej-lang-changed', { detail: { lang: lang } })); } catch(e){}
  }
  window.EJ_applyStaticTranslations = applyStaticTranslations;

  window.EJ_translateSpecLabel = function(label, lang){
    var d = I18N.specLabels[label];
    return (lang !== 'it' && d && d[lang]) ? d[lang] : label;
  };
  window.EJ_translateSpecValue = function(label, value, lang){
    if (lang === 'it') return value;
    if (label === 'Misure') {
      var axis = I18N.axisLabel[lang];
      if (axis) return value.replace('(L x A x P)', '(' + axis + ')');
      return value;
    }
    if (label === 'Prezzo') {
      var suf = I18N.priceSuffix[lang];
      if (suf) return value.replace('— spedizione inclusa', suf);
      return value;
    }
    var d = I18N.specValues[value];
    return (d && d[lang]) ? d[lang] : value;
  };
  window.EJ_translateColor = function(name, lang){
    var d = I18N.colors[name];
    return (lang !== 'it' && d && d[lang]) ? d[lang] : name;
  };
  window.EJ_translateDesc = function(modelId, fallback, lang){
    var d = I18N.modelDescs[modelId];
    return (lang !== 'it' && d && d[lang]) ? d[lang] : fallback;
  };
  window.EJ_fmtEuro = function(n){
    if (Math.round(n * 100) % 100 === 0) return String(Math.round(n));
    return n.toFixed(2).replace('.', ',');
  };
  window.EJ_translateCountry = function(name, lang){
    var d = I18N.countries[name];
    return (lang !== 'it' && d && d[lang]) ? d[lang] : name;
  };
  window.EJ_t = function(key, lang){
    var d = I18N.ui[key];
    if (!d) return key;
    if (lang !== 'it' && d[lang]) return d[lang];
    return d['it'] || key;
  };

  function buildSwitcher(){
    var nav = document.getElementById('lang-switch-mount') || document.querySelector('nav.wrap');
    if (!nav || document.getElementById('lang-select')) return;
    var wrap = document.createElement('div');
    wrap.className = 'lang-switch';
    var sel = document.createElement('select');
    sel.id = 'lang-select';
    sel.setAttribute('aria-label', 'Lingua / Language');
    I18N.langs.forEach(function(l){
      var opt = document.createElement('option');
      opt.value = l;
      var flag = I18N.langFlags && I18N.langFlags[l] ? I18N.langFlags[l] + ' ' : '';
      opt.textContent = flag + (I18N.langLabels[l] || l.toUpperCase());
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function(){ setLang(sel.value); });
    wrap.appendChild(sel);
    nav.appendChild(wrap);
    sel.value = getLang();
  }

  document.addEventListener('DOMContentLoaded', function(){
    buildSwitcher();
    setLang(getLang());
  });
})();
</script>

</body>
</html>
